[global]
  i: 127.0.0.1
  e2dsa
  e2ts
  no-thumb
  no-robots
  force-js
  name: copyparty
{% for user in copyparty_tailnet_users %}
  idp-hm-usr: ^Tailscale-User-Login^{{ user.tailscale_login }}^{{ user.copyparty_user }}
{% endfor %}

[/]
  /data
  accs:
    {{ copyparty_permissions }}: {{ copyparty_tailnet_users | map(attribute='copyparty_user') | join(', ') }}
