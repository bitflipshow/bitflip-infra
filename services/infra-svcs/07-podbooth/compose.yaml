configs:
  podbooth-ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:8000"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}
  livekit-ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:7880"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  podbooth:
    image: ghcr.io/fuzzymistborn/podbooth:0.15.2
    container_name: podbooth-app
    restart: unless-stopped
    network_mode: service:podbooth-ts
    depends_on:
      - podbooth-ts
      - livekit
    volumes:
      - "{{ podbooth_appdata_path }}/recordings:/recordings"
    environment:
    # LiveKit — must match the keys block in livekit/livekit.yaml
      - LIVEKIT_API_KEY={{ vault_livekit_api_key | replace('$', '$$') }}
      - LIVEKIT_API_SECRET={{ vault_livekit_api_secret | replace('$', '$$') }}
    # Server-side LiveKit API (e.g. removing a guest from the call). The app
    # runs in podbooth-ts's network, where the name "livekit" doesn't resolve
    # (livekit has no network of its own — it shares livekit-ts's), so use
    # livekit-ts's tailnet IP.
      - LIVEKIT_URL=http://100.86.223.92:7880
    # Public WebSocket URL that browsers connect to
      - LIVEKIT_PUBLIC_URL=wss://livekit.komodo-gecko.ts.net
    # App settings
      - SECRET_KEY={{ vault_podbooth_secret_key | replace('$', '$$') }}
      - BASE_URL=https://podbooth.komodo-gecko.ts.net
      - RECORDINGS_DIR=/recordings
      - WHISPERX_API_URL=http://100.88.95.2:8200
      - TZ={{ TZ }}
      - LOG_LEVEL=warning
      - RETENTION_DAYS=10
      - API_KEY={{ vault_podbooth_api_key | replace('$', '$$') }}
      - CLOUD_UPLOAD_BACKEND=r2
      - DIRECT_CLOUD_UPLOAD=true
    # Cloud Storage (R2)
      - R2_ACCOUNT_ID={{ vault_podbooth_r2_account | replace('$', '$$') }}
      - R2_ACCESS_KEY_ID={{ vault_podbooth_r2_key_id | replace('$', '$$') }}
      - R2_ACCESS_KEY_SECRET={{ vault_podbooth_r2_key_secret | replace('$', '$$') }}
      - R2_BUCKET=recorded-files
    # Cloud Storage (FileBrowser)
      - FILEBROWSER_URL=http://100.104.240.5:8080
      - FILEBROWSER_USER=production
      - FILEBROWSER_PASSWORD={{ vault_podbooth_fb_password | replace('$', '$$') }}
    # Editor
      - EDITOR_PORTAL_URL={{ vault_podbooth_portal_url | replace('$', '$$') }}
      - DISCORD_WEBHOOK_URL={{ vault_podbooth_webhook_url | replace('$', '$$') }}
    # Outline
      - OUTLINE_API_URL=https://outline.komodo-gecko.ts.net
      - OUTLINE_API_KEY={{ vault_podbooth_outline_api | replace('$', '$$') }}
    # Uncomment to require a password for the host UI:
    #  - HOST_PASSWORD=your-password

  podbooth-ts:
    image: tailscale/tailscale:latest
    container_name: podbooth-ts
    hostname: podbooth
    environment:
#      - TS_AUTHKEY={{ vault_ts_oauth_client_secret | replace('$', '$$') }}
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve-config.json
      - TS_USERSPACE=false
    volumes:
      - "{{ podbooth_appdata_path }}/ts-state:/var/lib/tailscale"
    configs:
      - source: podbooth-ts-serve
        target: /config/serve-config.json
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13
    container_name: livekit
    restart: unless-stopped
    network_mode: service:livekit-ts
    depends_on:
      livekit-ts:
        condition: service_healthy
        restart: true
    # LiveKit picks the addresses it uses for calls when it starts. If it
    # starts before livekit-ts has its tailnet IPv6 (fd7a:…), it never uses
    # it and video fails for everyone until LiveKit is restarted. Wait for
    # the address first — this also covers host reboots, where Docker
    # starts containers without honouring depends_on.
    entrypoint:
      - /bin/sh
      - -c
      - |
        until ip -6 addr show dev tailscale0 2>/dev/null | grep -q 'inet6 fd7a:'; do
          echo "waiting for tailnet IPv6 on tailscale0"
          sleep 2
        done
        exec /livekit-server --config /livekit.yaml
    command: []
    volumes:
      - "{{ livekit_appdata_path }}/config/livekit.yaml:/livekit.yaml"

  livekit-ts:
    image: tailscale/tailscale:latest
    container_name: livekit-ts
    hostname: livekit
    environment:
#      - TS_AUTHKEY={{ vault_ts_oauth_client_secret | replace('$', '$$') }}
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve-config.json
      - TS_USERSPACE=false
    volumes:
      - "{{ livekit_appdata_path }}/ts-state:/var/lib/tailscale"
    configs:
      - source: livekit-ts-serve
        target: /config/serve-config.json
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    restart: unless-stopped
    # Healthy only once the tailnet IPv6 is on the interface — see the
    # comment on livekit's entrypoint.
    healthcheck:
      test: ["CMD-SHELL", "ip -6 addr show dev tailscale0 | grep -q 'inet6 fd7a:'"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
