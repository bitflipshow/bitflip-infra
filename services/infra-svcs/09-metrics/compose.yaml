configs:
  metrics-ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:8787"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  metrics-ts:
    image: tailscale/tailscale:latest
    container_name: metrics-ts
    hostname: metrics
    environment:
      - TS_AUTHKEY={{ vault_ts_oauth_client_secret | replace('$', '$$') }}
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve-config.json
      - TS_USERSPACE=false
    volumes:
      - "{{ metrics_appdata_path }}/ts-state:/var/lib/tailscale"
    configs:
      - source: metrics-ts-serve
        target: /config/serve-config.json
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    restart: unless-stopped

  metrics:
    image: bitflip-analytics:local
    build:
      context: /opt/src/bitflip-site/analytics
      dockerfile: Dockerfile
    container_name: metrics
    network_mode: service:metrics-ts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 15m
    depends_on:
      - metrics-ts
    volumes:
      - "{{ metrics_appdata_path }}/data:/data"
    environment:
      - DB_PATH=/data/analytics.sqlite3
      - MANIFEST_URL=https://bitflip.show/analytics-manifest.json
      - ADMIN_USER=bitflip
      - ADMIN_PASSWORD={{ vault_metrics_admin_password | replace('$', '$$') }}
      - HASH_SECRET={{ vault_metrics_hash_secret | replace('$', '$$') }}
      - R2_ACCOUNT_ID={{ vault_metrics_r2_account_id }}
      - R2_ACCESS_KEY_ID={{ vault_metrics_r2_access_key_id }}
      - R2_SECRET_ACCESS_KEY={{ vault_metrics_r2_secret_access_key | replace('$', '$$') }}
      - R2_EVENTS_BUCKET=bitflip-analytics-events
      - YOUTUBE_CLIENT_ID={{ vault_metrics_youtube_client_id | default('') }}
      - YOUTUBE_CLIENT_SECRET={{ vault_metrics_youtube_client_secret | default('') | replace('$', '$$') }}
      - YOUTUBE_REFRESH_TOKEN={{ vault_metrics_youtube_refresh_token | default('') | replace('$', '$$') }}
