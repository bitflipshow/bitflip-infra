configs:
  dockhand-ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:3000"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  dockhand:
    image: fnsys/dockhand:v1.0.36
    container_name: dockhand
    restart: unless-stopped
    network_mode: service:dockhand-ts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "{{ dockhand_appdata_path }}/data:/app/data"

  dockhand-ts:
    image: tailscale/tailscale:latest
    container_name: dockhand-ts
    hostname: dockhand
    environment:
#      - TS_AUTHKEY={{ vault_ts_oauth_client_secret | replace('$', '$$') }}
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve-config.json
      - TS_USERSPACE=false
    volumes:
      - "{{ dockhand_appdata_path }}/ts-state:/var/lib/tailscale"
    configs:
      - source: dockhand-ts-serve
        target: /config/serve-config.json
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    restart: unless-stopped