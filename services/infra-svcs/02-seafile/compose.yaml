configs:
  seafile-ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:80"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  seafile-ts:
    image: tailscale/tailscale:latest
    container_name: seafile-ts
    hostname: seafile
    environment:
      - TS_AUTHKEY={{ vault_ts_oauth_client_secret | replace('$', '$$') }}
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve-config.json
      - TS_USERSPACE=false
    volumes:
      - "{{ seafile_appdata_path }}/ts-state:/var/lib/tailscale"
    configs:
      - source: seafile-ts-serve
        target: /config/serve-config.json
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    networks:
      - seafile-net
    restart: unless-stopped

  seafile-db:
    image: mariadb:10.11
    container_name: seafile-db
    environment:
      - MYSQL_ROOT_PASSWORD={{ vault_seafile_mysql_root_password | replace('$', '$$') }}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - "{{ seafile_appdata_path }}/db:/var/lib/mysql"
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/healthcheck.sh
        - --connect
        - --mariadbupgrade
        - --innodb_initialized
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10
    networks:
      - seafile-net
    restart: unless-stopped

  seafile-redis:
    image: redis:7-alpine
    container_name: seafile-redis
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "$$REDIS_PASSWORD"
    environment:
      - REDIS_PASSWORD={{ vault_seafile_redis_password | replace('$', '$$') }}
    networks:
      - seafile-net
    restart: unless-stopped

  seafile:
    image: seafileltd/seafile-mc:13.0-latest
    container_name: seafile
    volumes:
      - "{{ seafile_appdata_path }}:/shared"
      - "{{ seafile_data_path }}:/shared/seafile/seafile-data"
    environment:
      - SEAFILE_MYSQL_DB_HOST=seafile-db
      - SEAFILE_MYSQL_DB_PORT=3306
      - SEAFILE_MYSQL_DB_USER=seafile
      - SEAFILE_MYSQL_DB_PASSWORD={{ vault_seafile_mysql_password | replace('$', '$$') }}
      - INIT_SEAFILE_MYSQL_ROOT_PASSWORD={{ vault_seafile_mysql_root_password | replace('$', '$$') }}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=ccnet_db
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=seafile_db
      - SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=seahub_db
      - TIME_ZONE={{ seafile_time_zone }}
      - INIT_SEAFILE_ADMIN_EMAIL={{ seafile_admin_email }}
      - INIT_SEAFILE_ADMIN_PASSWORD={{ vault_seafile_admin_password | replace('$', '$$') }}
      - SEAFILE_SERVER_HOSTNAME={{ seafile_domain }}
      - SEAFILE_SERVER_PROTOCOL=https
      - SITE_ROOT=/
      - JWT_PRIVATE_KEY={{ vault_seafile_jwt_private_key | replace('$', '$$') }}
      - SEAFILE_LOG_TO_STDOUT=true
      - ENABLE_GO_FILESERVER=true
      - ENABLE_SEADOC=false
      - CACHE_PROVIDER=redis
      - REDIS_HOST=seafile-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD={{ vault_seafile_redis_password | replace('$', '$$') }}
    depends_on:
      seafile-db:
        condition: service_healthy
      seafile-redis:
        condition: service_started
      seafile-ts:
        condition: service_started
    network_mode: service:seafile-ts
    restart: unless-stopped

networks:
  seafile-net:
    name: seafile-net
