configs:
  kasm-ts-serve:
    content: |
      {"TCP":{"443":{"TCPForward":"127.0.0.1:443"}}}

services:
  kasm-ts:
    image: tailscale/tailscale:latest
    container_name: kasm-ts
    hostname: kasm
    environment:
#      - TS_AUTHKEY={{ vault_ts_oauth_client_secret | replace('$', '$$') }}
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve-config.json
      - TS_USERSPACE=false
    volumes:
      - "{{ kasm_appdata_path }}/ts-state:/var/lib/tailscale"
    configs:
      - source: kasm-ts-serve
        target: /config/serve-config.json
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    restart: unless-stopped
  kasm:
    image: lscr.io/linuxserver/kasm:latest
    container_name: kasm
    network_mode: service:kasm-ts
    privileged: true
    volumes:
      - "{{ kasm_appdata_path }}/config:/config"
    environment:
      - KASM_PORT=443
    shm_size: "2gb"
    restart: unless-stopped
    depends_on:
      - kasm-ts
