configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:3000"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}
services:
  hedgedoc-ts:
    image: tailscale/tailscale:latest
    container_name: hedgedoc-ts
    hostname: hedgedoc
    environment:
      - TS_AUTHKEY={{ vault_hedgedoc_ts_auth_key | replace('$', '$$') }}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve-config.json
      - TS_USERSPACE=false
    volumes:
      - "{{ appdata_path }}/apps/hedgedoc/ts-state:/var/lib/tailscale"
      - "{{ appdata_path }}/apps/hedgedoc/serve-config.json:/config/serve-config.json:ro"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    restart: unless-stopped

  hedgedoc:
    image: quay.io/hedgedoc/hedgedoc:1.10.5
    container_name: hedgedoc
    environment:
      - CMD_DB_URL=postgres://hedgedoc:{{ vault_hedgedoc_db_password | replace('$', '$$') }}@hedgedoc-db:5432/hedgedoc
      - CMD_DOMAIN={{ hedgedoc_domain }}
      - CMD_URL_ADDPORT=false
      - CMD_PROTOCOL_USESSL=true
      - CMD_SESSION_SECRET={{ vault_hedgedoc_session_secret | replace('$', '$$') }}
      - CMD_OAUTH2_PROVIDERNAME={{ hedgedoc_oidc_provider_name }}
      - CMD_OAUTH2_SCOPE={{ hedgedoc_oidc_scope }}
      - CMD_OAUTH2_AUTHORIZATION_URL={{ hedgedoc_oidc_authorization_url }}
      - CMD_OAUTH2_TOKEN_URL={{ hedgedoc_oidc_token_url }}
      - CMD_OAUTH2_USER_PROFILE_URL={{ hedgedoc_oidc_userinfo_url }}
      - CMD_OAUTH2_USER_PROFILE_USERNAME_ATTR={{ hedgedoc_oidc_username_attr }}
      - CMD_OAUTH2_USER_PROFILE_DISPLAY_NAME_ATTR={{ hedgedoc_oidc_display_name_attr }}
      - CMD_OAUTH2_USER_PROFILE_EMAIL_ATTR={{ hedgedoc_oidc_email_attr }}
      - CMD_OAUTH2_CLIENT_ID={{ vault_hedgedoc_oidc_client_id }}
      - CMD_OAUTH2_CLIENT_SECRET={{ vault_hedgedoc_oidc_client_secret | replace('$', '$$') }}
    volumes:
      - "{{ appdata_path }}/apps/hedgedoc/uploads:/hedgedoc/public/uploads"
    depends_on:
      - hedgedoc-db
      - hedgedoc-ts
    network_mode: service:hedgedoc-ts
    restart: unless-stopped
  hedgedoc-db:
    image: postgres:17.7-alpine
    container_name: hedgedoc-db
    environment:
      - POSTGRES_USER=hedgedoc
      - POSTGRES_PASSWORD={{ vault_hedgedoc_db_password | replace('$', '$$') }}
      - POSTGRES_DB=hedgedoc
    volumes:
      - "{{ appdata_path }}/apps/hedgedoc/db:/var/lib/postgresql/data"
    restart: unless-stopped
