name: Deploy infra-svcs

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      configure_metrics_only:
        description: Encrypt staged metrics credentials without deploying services
        type: boolean
        default: false

jobs:
  configure-metrics:
    if: github.event_name == 'workflow_dispatch' && inputs.configure_metrics_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install ansible-core boto3==1.40.40
      - name: Configure vault helper
        run: |
          cat > "$RUNNER_TEMP/ansible-vault-pass" <<'EOF'
          #!/usr/bin/env bash
          printf '%s' "$VAULT_PASSWORD"
          EOF
          chmod 700 "$RUNNER_TEMP/ansible-vault-pass"
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$RUNNER_TEMP/ansible-vault-pass" >> "$GITHUB_ENV"
      - name: Verify restricted R2 access
        env:
          METRICS_BOOTSTRAP_JSON: ${{ secrets.METRICS_BOOTSTRAP_JSON }}
        run: python scripts/verify_metrics_r2.py
      - name: Encrypt metrics configuration
        env:
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
          METRICS_BOOTSTRAP_JSON: ${{ secrets.METRICS_BOOTSTRAP_JSON }}
        run: python scripts/configure_metrics_vault.py
      - uses: actions/upload-artifact@v4
        with:
          name: metrics-vault
          path: metrics-vault.yaml
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: github.event_name != 'workflow_dispatch' || !inputs.configure_metrics_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Install Ansible collections
        run: ansible-galaxy collection install community.general

      - name: Configure Ansible vault password helper
        run: |
          cat > "$RUNNER_TEMP/ansible-vault-pass" <<'EOF'
          #!/usr/bin/env bash
          printf '%s' "$VAULT_PASSWORD"
          EOF
          chmod 700 "$RUNNER_TEMP/ansible-vault-pass"
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$RUNNER_TEMP/ansible-vault-pass" >> "$GITHUB_ENV"

      - name: Load Tailscale OAuth credentials from Ansible vault
        shell: bash
        env:
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
        run: |
          vault_contents=$(ansible-vault view group_vars/secrets.yaml)
          client_id=$(awk -F': ' '/^vault_ts_oauth_client_id:/{print $2; exit}' <<< "$vault_contents")
          client_secret=$(awk -F': ' '/^vault_ts_oauth_client_secret:/{print $2; exit}' <<< "$vault_contents")
          if [[ -z "$client_id" || -z "$client_secret" ]]; then
            echo '::error::Tailscale OAuth credentials are missing from Ansible Vault'
            exit 1
          fi

          # Vault values are not automatically masked by GitHub Actions.
          printf '::add-mask::%s\n' "$client_id" "$client_secret"
          {
            printf 'TS_OAUTH_CLIENT_ID=%s\n' "$client_id"
            printf 'TS_OAUTH_CLIENT_SECRET=%s\n' "$client_secret"
          } >> "$GITHUB_ENV"

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:server
          ping: infra-svcs.komodo-gecko.ts.net

      - name: Verify Tailscale SSH to infra-svcs
        run: ssh -o StrictHostKeyChecking=no root@infra-svcs.komodo-gecko.ts.net true

      - name: Deploy compose stack to infra-svcs
        env:
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
        run: ansible-playbook -b playbook.yaml --limit infra-svcs --tags compose
