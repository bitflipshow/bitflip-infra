# ironicbadger.figurine
figurine_name: bf-infra-svcs

# docker-compose-generator expects services/<hostname>; inventory uses FQDN
docker_compose_hostname: infra-svcs
docker_compose_generator_deploy: true
docker_compose_generator_output_path: /opt

# shared paths
appdata_path: /opt/appdata

# TZ
TZ: America/New_York

# copyparty
copyparty_data_path: "{{ appdata_path }}/apps/copyparty/data"
copyparty_permissions: rwmd
copyparty_tailnet_users:
  - tailscale_login: ndls-Stephen@github
    copyparty_user: ndls-stephen
  - tailscale_login: kodiak879@github
    copyparty_user: kodiak879
  - tailscale_login: FuzzyMistborn@github
    copyparty_user: fuzzymistborn
  - tailscale_login: ironicbadger@github
    copyparty_user: ironicbadger

# filebrowser
filebrowser_domain: files.komodo-gecko.ts.net
filebrowser_appdata_path: /opt/appdata/filebrowser
filebrowser_data_path: /mnt/bitflip/data

# outline
outline_domain: outline.komodo-gecko.ts.net
outline_appdata_path: "{{ appdata_path }}/apps/outline"

# showclock
showclock_appdata_path: "{{ appdata_path }}/apps/showclock"

# dashy
dashy_appdata_path: "{{ appdata_path }}/apps/dashy"

# vaultwarden
vaultwarden_domain: vaultwarden.komodo-gecko.ts.net
vaultwarden_appdata_path: "{{ appdata_path }}/apps/vaultwarden"

# kasm
kasm_appdata_path: "{{ appdata_path }}/apps/kasm"

# podbooth/livekit
podbooth_appdata_path: "{{ appdata_path }}/apps/podbooth"
livekit_appdata_path: "{{ appdata_path }}/apps/livekit"

# dockhand
dockhand_appdata_path: "{{ appdata_path }}/apps/dockhand"