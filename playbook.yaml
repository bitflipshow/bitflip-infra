---
- hosts: infra-svcs
  vars_files:
    - group_vars/secrets.yaml
  roles:
    - role: ironicbadger.figurine
    - role: ironicbadger.docker-compose-generator
      tags: compose
  tasks:
    - name: Deploy rendered compose stack
      when: docker_compose_generator_deploy | default(false)
      tags:
        - compose
      block:
        - name: Apply compose stack
          command:
            argv:
              - docker
              - compose
              - -f
              - "{{ docker_compose_generator_output_path }}/compose.yaml"
              - up
              - -d
              - --remove-orphans
          register: infra_svcs_compose_apply
          changed_when: >-
            infra_svcs_compose_apply.stdout is search(
              'Creating|Created|Recreating|Starting|Started|Removing'
            )

        - name: Prune unused Docker images
          command:
            argv:
              - docker
              - image
              - prune
              - --all
              - --force
          register: infra_svcs_image_prune
          changed_when: "'Deleted Images:' in infra_svcs_image_prune.stdout"
